keys:
  # Your master key: replace with the public key age-keygen prints.
  - &admin age1REPLACEME_ADMIN
  # Hosts' keys, from their SSH host keys (careen keys register).
  - &web1_host age1REPLACEME_WEB1

creation_rules:
  - path_regex: secrets/hosts/web1/.*\.yaml$
    key_groups:
      - age: [*admin, *web1_host]
